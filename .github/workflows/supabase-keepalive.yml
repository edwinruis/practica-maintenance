name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 12 */6 * *'  # Runs every 6 days at noon UTC
  workflow_dispatch:          # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase at $(date)"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zolihrdpfcskqpbwodej.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvbGlocmRwZmNza3FwYndvZGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTYyMzgsImV4cCI6MjA5MDczMjIzOH0.3qUlS4jPCROtwNu5vtbWvC3K5hVcEWcU5NZ8Lp4K43E" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvbGlocmRwZmNza3FwYndvZGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTYyMzgsImV4cCI6MjA5MDczMjIzOH0.3qUlS4jPCROtwNu5vtbWvC3K5hVcEWcU5NZ8Lp4K43E")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Ping successful. Supabase is active."
          else
            echo "Unexpected response: $RESPONSE"
            exit 1
          fi
