name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 12 */5 * *'  # Every 5 days - stays safely under 7-day pause limit
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          echo "Pinging Supabase at $(date)"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zolihrdpfcskqpbwodej.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Ping successful. Supabase is active."
          else
            echo "Unexpected response: $RESPONSE"
            exit 1
          fi
